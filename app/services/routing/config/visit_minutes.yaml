# Expected visit length in minutes (app/services/routing/visits.py). For a place, in order:
# its own value (`places`), the restaurant style (`restaurant_style`), its category (taxonomy
# top.sub: the typical, median visit to an ordinary place of that category), then `default`.
# Basis of the category values and the per-traveller modifiers still to come:
# docs/visit-duration-basis.md (section 3).
version: visit-minutes-v2
default: 40
# The longest visit, by top-level category (team decisions 2026-11-25: none of these places is
# that big): a sight 1 h 30, anything else 2 h. Applied to every place; a traveller can still
# lengthen a stop in the app.
max_minutes:
  default: 120
  attraction: 90
  culture_religion: 90
  nature: 90
  shopping: 90
categories:
  food.restaurant: 60
  food.street_food: 30
  food.food_court: 45
  food.cafe: 45
  attraction.museum: 90
  attraction.gallery: 60
  attraction.landmark: 45
  attraction.historic_site: 45
  attraction.viewpoint: 45
  attraction.zoo: 90
  attraction.theme_park: 90
  culture_religion.church: 30
  culture_religion.pagoda: 40
  culture_religion.temple: 40
  culture_religion.shrine: 30
  culture_religion.mosque: 30
  nature.park: 45
  nature.garden: 45
  shopping.mall: 90
  shopping.market: 60
  shopping.department_store: 60
  entertainment.nightlife: 90
  entertainment.karaoke: 120
  entertainment.cinema: 120
  entertainment.performing_arts: 120

# Restaurants by style, as in docs/visit-duration-basis.md 2.3 (60 x 1.5, x 0.6, x 1.25; team
# estimates, no Vietnamese measurements). A Michelin star first, then the first style whose words
# appear as whole words in the name (or whose cuisine the place has). Words keep their Vietnamese
# marks, so a name written without them keeps its category value.
restaurant_style:
  michelin_star: 90
  quick:
    minutes: 35
    words: [phở, bún, bánh mì, cơm tấm, hủ tiếu, hủ tíu, bánh cuốn, xôi, bánh xèo, mì quảng,
      cao lầu, bánh canh, cháo, bò kho, bột chiên, bánh căn, bánh khọt, bánh bèo, bánh ướt,
      cơm gà, cơm hến, bánh tráng, mì, mỳ, miến, nem lụi, nem nướng, bò lá lốt]
    cuisines: [noodle, ramen]
  long:
    minutes: 75
    words: [lẩu, nướng, buffet, bbq, hotpot, hot pot, steak, steakhouse, omakase, fine dining]
    cuisines: [barbecue, buffet, fine_dining, steakhouse, hotpot, grill, bar_and_grill]

