[project]
name = "journie-be"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "tzdata>=2025.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
